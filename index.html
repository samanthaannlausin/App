<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Contact List</title>

    <!-- React -->
    <script src='https://unpkg.com/react@16.8.0/umd/react.production.min.js'></script>
    <script src='https://unpkg.com/react-dom@16.8.0/umd/react-dom.production.min.js'></script>
    <script src='https://unpkg.com/react-router-dom@5.0.0/umd/react-router-dom.min.js'></script>
    <script src='https://unpkg.com/babel-standalone@6.26.0/babel.js'></script>

    <!-- ✅ Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<div id="root"></div>

<script type="text/babel">
const { HashRouter, Switch, Route, Link } = ReactRouterDOM;
const { useState, useEffect } = React;

const Home = () => (
    <div className="text-center">
        <h1 className="mb-3">Welcome</h1>
        <p className="text-muted">Simple Contact List App</p>
    </div>
);

const About = () => (
    <div className="card p-4 shadow-sm">
        <h2>About</h2>
        <p>This app stores contacts using localStorage.</p>
    </div>
);

const ContactList = () => {
    const [contacts, setContacts] = useState([]);
    const [name, setName] = useState("");
    const [phone, setPhone] = useState("");
    const [address, setAddress] = useState("");
    const [notes, setNotes] = useState("");

    useEffect(() => {
        const saved = JSON.parse(localStorage.getItem("contacts")) || [];
        setContacts(saved);
    }, []);

    useEffect(() => {
        localStorage.setItem("contacts", JSON.stringify(contacts));
    }, [contacts]);

    const addContact = () => {
        if (!name || !phone) {
            alert("Fill name and phone");
            return;
        }

        if (contacts.some(c => c.phone === phone)) {
            alert("Duplicate number");
            return;
        }

        setContacts([
            { name, phone, address, notes },
            ...contacts
        ]);

        setName("");
        setPhone("");
        setAddress("");
        setNotes("");
    };

    const deleteContact = (index) => {
        setContacts(contacts.filter((_, i) => i !== index));
    };

    return (
        <div>
            {/* FORM */}
            <div className="card p-4 shadow-sm mb-4">
                <h3 className="mb-3">Add Contact</h3>

                <div className="row g-3">
                    <div className="col-md-6">
                        <input className="form-control"
                            placeholder="Name"
                            value={name}
                            onChange={(e) => setName(e.target.value)} />
                    </div>

                    <div className="col-md-6">
                        <input className="form-control"
                            placeholder="Phone"
                            value={phone}
                            onChange={(e) => setPhone(e.target.value)} />
                    </div>

                    <div className="col-12">
                        <input className="form-control"
                            placeholder="Address"
                            value={address}
                            onChange={(e) => setAddress(e.target.value)} />
                    </div>

                    <div className="col-12">
                        <textarea className="form-control"
                            placeholder="Notes"
                            value={notes}
                            onChange={(e) => setNotes(e.target.value)} />
                    </div>

                    <div className="col-12">
                        <button className="btn btn-primary w-100" onClick={addContact}>
                            Add Contact
                        </button>
                    </div>
                </div>
            </div>

            {/* CONTACT LIST */}
            <div className="row">
                {contacts.map((c, i) => (
                    <div className="col-md-6 mb-3" key={i}>
                        <div className="card p-3 shadow-sm">
                            <h5>{c.name}</h5>
                            <p className="mb-1"><strong>Phone:</strong> {c.phone}</p>
                            <p className="mb-1"><strong>Address:</strong> {c.address || "-"}</p>
                            <p className="mb-2"><strong>Notes:</strong> {c.notes || "-"}</p>
                            <button className="btn btn-danger btn-sm"
                                onClick={() => deleteContact(i)}>
                                Delete
                            </button>
                        </div>
                    </div>
                ))}
            </div>
        </div>
    );
};

const App = () => (
    <HashRouter>
        {/* NAVBAR */}
        <nav className="navbar navbar-dark bg-dark">
            <div className="container">
                <span className="navbar-brand">Contact App</span>
                <div>
                    <Link className="btn btn-outline-light btn-sm me-2" to="/">Home</Link>
                    <Link className="btn btn-outline-light btn-sm me-2" to="/about">About</Link>
                    <Link className="btn btn-outline-light btn-sm" to="/contacts">Contacts</Link>
                </div>
            </div>
        </nav>

        <div className="container mt-4">
            <Switch>
                <Route exact path="/" component={Home} />
                <Route path="/about" component={About} />
                <Route path="/contacts" component={ContactList} />
            </Switch>
        </div>
    </HashRouter>
);

ReactDOM.render(<App />, document.getElementById("root"));
</script>

</body>
</html>
